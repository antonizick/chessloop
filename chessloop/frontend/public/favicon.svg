<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100" height="100" fill="#0a0a0b" rx="16"/>

  <!-- Chessboard pattern -->
  <g opacity="0.2">
    <rect x="10" y="10" width="15" height="15" fill="#d4af44"/>
    <rect x="40" y="10" width="15" height="15" fill="#d4af44"/>
    <rect x="70" y="10" width="15" height="15" fill="#d4af44"/>
    <rect x="25" y="25" width="15" height="15" fill="#d4af44"/>
    <rect x="55" y="25" width="15" height="15" fill="#d4af44"/>
  </g>

  <!-- Knight piece (centered) -->
  <g transform="translate(50, 50)">
    <!-- Knight outline -->
    <path d="M -8 -12 L -5 -14 L -2 -13 L 0 -15 L 3 -13 L 6 -14 L 8 -12 L 6 -8 L 4 -6 L 5 -2 L 8 0 L 8 8 L -8 8 L -8 0 L -5 -2 L -4 -6 L -6 -8 Z" fill="#d4af44" stroke="#c79a2d" stroke-width="1"/>
    <!-- Eye -->
    <circle cx="2" cy="-8" r="1.5" fill="#c79a2d"/>
  </g>
</svg>
