server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    set $backend_host "backend:8000";
    set $frontend_host "frontend:80";

    client_max_body_size 10m;

    # Permissive CORS headers for testing
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' '*' always;

    # No frame restrictions for testing
    add_header 'X-Frame-Options' 'ALLOWALL' always;

    # Permissive CSP for testing
    add_header 'Content-Security-Policy' "default-src *; script-src 'unsafe-inline' 'unsafe-eval' *; style-src 'unsafe-inline' *; img-src * data:; font-src *; connect-src *; frame-ancestors *;" always;

    # Support both /api (root) and /chess/api (subpath)
    location ~ ^/chess/api/ {
        # Strip /chess prefix before proxying to backend
        rewrite ^/chess/api/(.*) /api/$1 break;
        proxy_pass http://$backend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /chess;
        proxy_set_header Connection "";

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location ~ ^/api/ {
        proxy_pass http://$backend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location ~ ^/chess/docs {
        rewrite ^/chess/docs/(.*) /docs/$1 break;
        proxy_pass http://$backend_host;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://$backend_host;
        proxy_set_header Host $host;
    }

    location ~ ^/chess/openapi.json {
        rewrite ^/chess/(.*) /$1 break;
        proxy_pass http://$backend_host;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://$backend_host;
        proxy_set_header Host $host;
    }

    # Chess app at /chess/ and root /
    location ~ ^/chess(/.*)?$ {
        proxy_pass http://$frontend_host$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://$frontend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }
}
