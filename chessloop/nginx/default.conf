# ChessLoop reverse proxy: serves the web UI and the API on one origin.
# Built into the nginx image (nginx/Dockerfile); after editing, rebuild with
#   docker compose -f docker-compose.prod.yml up -d --build

# Behind a TLS proxy (Caddy, Cloudflare, Tailscale Funnel…) keep the proxy's
# X-Forwarded-Proto, so the backend sees "https"; otherwise use our own scheme.
map $http_x_forwarded_proto $chessloop_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 10m;

    # Security headers. Only set here: an add_header inside a location would
    # drop all of these for that location.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # The SPA loads only its own scripts and calls only its own /api.
    # style-src 'unsafe-inline': admin-written banner/popup HTML may carry style
    # attributes. img-src https:: that HTML may show images from elsewhere.
    # data:: the chessboard's piece images and the MFA QR code.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $chessloop_forwarded_proto;
    proxy_set_header Connection "";

    # Restoring a backup uploads the whole database file.
    location = /api/admin/backups/upload {
        client_max_body_size 200m;
        proxy_pass http://backend:8000;
    }

    # Browser error reports need no sign-in; the backend caps each entry too.
    location = /api/logs/client {
        client_max_body_size 32k;
        proxy_pass http://backend:8000;
    }

    location /api/ {
        proxy_pass http://backend:8000;
    }

    # The interactive API docs (/docs, /openapi.json) are not published: they
    # fall through to the web UI below.

    location / {
        proxy_pass http://frontend:80;
    }
}
