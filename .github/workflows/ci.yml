name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chessloop/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r chessloop/backend/requirements.txt pytest
      - name: Run pytest
        working-directory: chessloop/backend
        env:
          CHESSLOOP_EMAIL_MX_CHECK: "false" # no network DNS lookups in tests
        run: python -m pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # Active LTS "Krypton" (nodejs.org/dist/index.json, 2026-10-16)
          cache: npm
          cache-dependency-path: chessloop/frontend/package-lock.json
      - name: Install dependencies
        working-directory: chessloop/frontend
        run: npm ci
      - name: Type check
        working-directory: chessloop/frontend
        run: npm run lint
      - name: Build
        working-directory: chessloop/frontend
        run: npm run build

  shell:
    name: ShellCheck (advisory)
    runs-on: ubuntu-24.04
    # Advisory until Phase 12 makes it required. deploy.sh and scripts/ are
    # clean since Phase 09 (manage.sh, which had warnings, was removed: F-017).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run ShellCheck v0.11.0
        run: |
          shopt -s nullglob
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            deploy.sh scripts/*.sh

  compose:
    name: Compose files validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate production compose file
        env:
          JWT_SECRET: ci-dummy-not-a-secret
        run: docker compose -f chessloop/docker-compose.prod.yml config -q
      - name: Validate development compose file
        env:
          JWT_SECRET: ci-dummy-not-a-secret
        run: docker compose -f chessloop/docker-compose.yml config -q

  images:
    name: Docker image build (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend, nginx]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.image }} (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: chessloop/${{ matrix.image }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  install:
    name: Install smoke (advisory)
    runs-on: ubuntu-24.04
    # Advisory until Phase 12 makes it required (R16).
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the installer clones this checkout
          persist-credentials: false
      - name: Unit tests for the installer's helpers
        run: bash scripts/test-deploy-helpers.sh
      - name: Install with deploy.sh --yes from this commit
        run: |
          git checkout -B ci-install
          pw="Ci-$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "CI_ADMIN_PASSWORD=$pw" >> "$GITHUB_ENV"
          CHESSLOOP_REPO="$GITHUB_WORKSPACE" CHESSLOOP_REF=ci-install \
          CHESSLOOP_ADMIN_EMAIL=ci-admin@example.com CHESSLOOP_ADMIN_PASSWORD="$pw" \
          CHESSLOOP_ACCESS=local CHESSLOOP_PORT=8090 \
            bash deploy.sh --yes
      - name: Smoke test (admin login, register, library, practice, restart)
        env:
          SMOKE_ADMIN_EMAIL: ci-admin@example.com
          SMOKE_ADMIN_PASSWORD: ${{ env.CI_ADMIN_PASSWORD }}
          SMOKE_RESTART_CMD: docker compose -f /opt/chessloop/chessloop/docker-compose.prod.yml restart
        run: bash scripts/smoke.sh http://localhost:8090
      - name: Back up, change the data, restore (chessloop backup / restore)
        run: |
          users() { docker exec chessloop-backend python -c 'import sqlite3; print(sqlite3.connect("/data/chessloop.db").execute("select count(*) from user").fetchone()[0])'; }
          chessloop backup --yes
          f=$(ls -1t ~/chessloop-backups/chessloop-*.tar.gz | head -n 1)
          test "$(stat -c %a "$f")" = 600
          (cd ~/chessloop-backups && sha256sum -c "$(basename "$f").sha256")
          before=$(users)
          curl -fsS -H 'Content-Type: application/json' -o /dev/null \
            -d '{"email":"after-backup@example.com","username":"afterbackup","password":"Rook-to-e1-after!"}' \
            http://localhost:8090/api/auth/register
          test "$(users)" = $((before + 1))
          chessloop restore "$f" --yes
          test "$(users)" = "$before"
      - name: Update when there is nothing new (chessloop update)
        run: chessloop update --yes
      - name: Admin login still works after restore and update
        env:
          SMOKE_ADMIN_EMAIL: ci-admin@example.com
          SMOKE_ADMIN_PASSWORD: ${{ env.CI_ADMIN_PASSWORD }}
        run: bash scripts/smoke.sh http://localhost:8090
      - name: Show logs
        if: failure()
        run: |
          docker compose -f /opt/chessloop/chessloop/docker-compose.prod.yml ps -a || true
          docker compose -f /opt/chessloop/chessloop/docker-compose.prod.yml logs --tail 200 || true
          tail -n 100 ~/chessloop-*.log || true

  docs:
    name: Docs links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links, anchors, images and banned words in the user docs
        run: python3 scripts/check-doc-links.py

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history
          persist-credentials: false
      - name: Run gitleaks v8.30.1
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose
