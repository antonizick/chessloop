name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chessloop/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r chessloop/backend/requirements.txt pytest
      - name: Run pytest
        working-directory: chessloop/backend
        env:
          CHESSLOOP_EMAIL_MX_CHECK: "false" # no network DNS lookups in tests
        run: python -m pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # Active LTS "Krypton" (nodejs.org/dist/index.json, 2026-10-16)
          cache: npm
          cache-dependency-path: chessloop/frontend/package-lock.json
      - name: Install dependencies
        working-directory: chessloop/frontend
        run: npm ci
      - name: Type check
        working-directory: chessloop/frontend
        run: npm run lint
      - name: Build
        working-directory: chessloop/frontend
        run: npm run build

  shell:
    name: ShellCheck (advisory)
    runs-on: ubuntu-24.04
    # Advisory: deploy.sh and manage.sh have warnings today (finding F-021).
    # Phases 08-09 rewrite them; Phase 12 makes this job required.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run ShellCheck v0.11.0
        run: |
          shopt -s nullglob
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            deploy.sh manage.sh scripts/*.sh

  compose:
    name: Compose files validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate production compose file
        env:
          JWT_SECRET: ci-dummy-not-a-secret
        run: docker compose -f chessloop/docker-compose.prod.yml config -q
      - name: Validate development compose file
        env:
          JWT_SECRET: ci-dummy-not-a-secret
        run: docker compose -f chessloop/docker-compose.yml config -q

  images:
    name: Docker image build (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend, nginx]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.image }} (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: chessloop/${{ matrix.image }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history
          persist-credentials: false
      - name: Run gitleaks v8.30.1
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose
