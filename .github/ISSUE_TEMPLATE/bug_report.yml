name: Bug report
description: Something in ChessLoop does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ChessLoop version or commit
      description: Run `git rev-parse --short HEAD` in the install folder, if you can.
  - type: input
    id: env
    attributes:
      label: Browser and operating system
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove passwords and secrets first.
